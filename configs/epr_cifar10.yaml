experiment:
    benchmark: 'cifar10-split'
    n_tasks: 5
    model: 'slim-resnet18'
    strategy: 'epr'
    n_classes: 10

train:
    optimizer: 'sgd'
    loss: 'cross_entropy'
    lr: 0.01
    momentum: 0.0
    weight_decay: 0.0

    batch_size: 32
    epochs: 10

strategy:
    mem_size: 2000
    mem_adaptive_size: True
    batch_size_mem: 32
    patch_size: 28
    stride: 1
    epr_selection: True

run_id: 'epr_cifar10'
setup:
    checkpoint_dir: './checkpoints'
    checkpoint_every: 1 # Create a checkpoint every n epochs: -1 means you checkpoint just at the end of each task
